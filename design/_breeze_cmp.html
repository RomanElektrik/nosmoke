<!doctype html><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}body{background:#0b0d10;font-family:-apple-system,system-ui,sans-serif;color:#e9eef4;padding:28px}
.row{display:flex;gap:60px;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:20px}
h3{font-size:15px;color:#aeb6c0;font-weight:700}
.big{width:200px;height:200px;border-radius:22.6%;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.home{width:240px;height:300px;border-radius:30px;overflow:hidden;position:relative;
  background:radial-gradient(120% 80% at 30% 10%,#22384a 0%,#101a24 55%,#0a121a 100%)}
.tile{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.appic{width:116px;height:116px;border-radius:26px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.lbl{font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:500}
.small{display:flex;gap:14px;align-items:center}
.s60{width:60px;height:60px;border-radius:22.6%;overflow:hidden}
.s40{width:40px;height:40px;border-radius:22.6%;overflow:hidden}
.appic svg,.big svg,.s60 svg,.s40 svg{width:100%;height:100%;display:block}
.cap{font-size:11px;color:#79838f}
</style>
