<!doctype html><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;
  background:linear-gradient(165deg,#2a4d6e 0%,#1d3550 35%,#3a2a55 70%,#5a3a6e 100%);position:relative}
.sb{display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0;color:#fff;font-weight:600;font-size:15px}
.grid{padding:26px 26px 0;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px}
.ic{width:60px;height:60px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.ic svg{width:100%;height:100%;display:block}
.lbl{font-size:11.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dock{position:absolute;left:14px;right:14px;bottom:22px;height:92px;border-radius:34px;background:rgba(255,255,255,0.18);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.dock .ic{box-shadow:none}
.dots{position:absolute;left:0;right:0;bottom:128px;text-align:center;color:#fff;letter-spacing:6px;font-size:9px;opacity:.8}
</style>
