<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бриз — стиль №26, понятнее</title>
<style>
  :root{--icon:170px;--accent:#7fe3c4;}*{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;background:radial-gradient(1100px 600px at 80% -10%,#13202b,#0a0c10 55%),#0a0c10;color:#e9eef4;}
  body.light{background:#eef1f6;color:#11151b;}
  header{position:sticky;top:0;z-index:9;backdrop-filter:blur(14px);background:rgba(10,12,16,.72);border-bottom:1px solid rgba(255,255,255,.08);padding:15px 22px;}
  body.light header{background:rgba(255,255,255,.8);}
  .h-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px;}h1 small{font-weight:500;color:#8a94a3;font-size:13px;margin-left:8px;}
  .controls{display:flex;align-items:center;gap:16px;margin-left:auto;}
  .ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#9aa4b2;}
  input[type=range]{accent-color:var(--accent);width:140px;}
  .toggle{cursor:pointer;border:1px solid rgba(255,255,255,.16);background:transparent;color:inherit;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;}
  #favs{font-size:12.5px;color:var(--accent);margin-top:10px;min-height:16px;font-weight:600;}
  main{padding:24px 22px 80px;max-width:1180px;margin:0 auto;}
  .hint{color:#79838f;font-size:13px;margin:0 0 22px;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .card{position:relative;background:#11161e;border:1px solid #1d242e;border-radius:20px;padding:16px;transition:.16s;}
  body.light .card{background:#fff;border-color:#e4e8ee;}
  .card:hover{transform:translateY(-3px);border-color:#2c3744;}
  .card.rec{border-color:rgba(127,227,196,.5);}
  .card.fav{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 30px rgba(127,227,196,.2);}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:210px;padding:10px;cursor:pointer;}
  .icon{width:var(--icon);height:var(--icon);border-radius:22.6%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.42);transition:width .12s,height .12s;}
  .icon svg{width:100%;height:100%;display:block;}
  .badge{position:absolute;top:6px;left:6px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 9px;}
  .card.fav .badge{background:var(--accent);color:#04231b;}
  .star-rec{position:absolute;top:6px;right:6px;font-size:13px;color:#ffd24a;}
  .nm{font-size:13.5px;font-weight:700;margin-top:10px;}
  .row{display:flex;gap:8px;margin-top:12px;}
  .row button{flex:1;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:inherit;border-radius:10px;padding:8px 6px;font-size:11.5px;font-weight:600;}
  body.light .row button{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.02);}
  .row button:hover{background:rgba(127,227,196,.15);border-color:var(--accent);}
  .fav.on{background:rgba(127,227,196,.2);border-color:var(--accent);color:var(--accent);}
</style></head><body>
<header><div class="h-row"><h1>Стиль №26 — понятнее <small>★ = ясно про «бросить курить»</small></h1>
<div class="controls"><label class="ctl">Размер <input id="size" type="range" min="56" max="240" value="170"></label>
<button class="toggle" id="bg">☀️ Светлый</button></div></div>
<div id="favs">Клик по иконке — в избранное, снизу номера.</div></header>
<main><p class="hint">Тот же стиль, что у №26 (тиловый градиент + мятно-зелёные фигуры), но теперь читается, что это про отказ от курения. ★ — где смысл самый явный. Ползунок — проверь мелкий размер. Скажи номер — доведу.</p>

ight="1024" fill="url(#g3_nosmokedisc_bg)"/><path d="M512 232 A268 268 0 1 1 511.99 232 Z M512 320 A180 180 0 1 0 512.01 320 Z" fill="#eafff6" fill-rule="evenodd"/><rect x="360" y="462" width="304" height="76" rx="16" fill="#7fe3c4" clip-path="url(#g3_nosmokedisc_clip)"/><path d="M330 690 L654 282 L726 339 L402 747 Z" fill="#eafff6" clip-path="url(#g3_nosmokedisc_clip)"/></svg></div><span class="badge">3</span><span class="star-rec">★</span></div><figcaption><div class="nm">Знак «не курить»</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card rec" data-num="4"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g4_lobe2_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g4_lobe2_bg)"/><rect x="494" y="270" width="36" height="170" rx="18" fill="#eafff6"/><path d="M494 360 C420 360 300 420 300 600 C300 730 380 790 470 770 C500 763 494 720 494 640 Z" fill="#eafff6"/><path d="M530 360 C604 360 724 420 724 600 C724 730 644 790 554 770 C524 763 530 720 530 640 Z" fill="#7fe3c4"/><circle cx="512" cy="300" r="56" fill="#eafff6"/></svg></div><span class="badge">4</span><span class="star-rec">★</span></div><figcaption><div class="nm">Лёгкие · дыхание</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card" data-num="5"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g5_lw1-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g5_lw1-bg)"/><path d="M512 300 Q496 360 496 430 Q420 360 322 348 Q258 342 232 392 Q300 430 326 506 Q356 596 452 638 Q494 656 496 612 L496 466 Q504 452 512 452 Q520 452 528 466 L528 612 Q530 656 572 638 Q668 596 698 506 Q724 430 792 392 Q766 342 702 348 Q604 360 528 430 Q528 360 512 300 Z" fill="#eafff6"/><path d="M512 470 Q470 524 470 596 Q470 672 512 724 Q554 672 554 596 Q554 524 512 470 Z" fill="#7fe3c4"/></svg></div><span class="badge">5</span></div><figcaption><div class="nm">Лёгкие-крылья · свобода</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card" data-num="6"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g6_leafB_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g6_leafB_bg)"/><path d="M512 792 C512 600 600 470 760 430 C764 632 668 760 512 792 Z" fill="#eafff6"/><path d="M512 792 C512 620 432 500 288 460 C284 648 372 766 512 792 Z" fill="#7fe3c4"/></svg></div><span class="badge">6</span></div><figcaption><div class="nm">Росток · свежесть</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card" data-num="7"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g7_leafA_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g7_leafA_bg)"/><path d="M512 232 C660 360 700 520 588 700 C548 588 540 460 512 360 C484 460 476 588 436 700 C324 520 364 360 512 232 Z" fill="#eafff6"/><rect x="486" y="640" width="52" height="160" rx="26" fill="#7fe3c4"/></svg></div><span class="badge">7</span></div><figcaption><div class="nm">Лист</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card" data-num="8"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g8_lobe1_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g8_lobe1_bg)"/><rect x="495" y="262" width="34" height="180" rx="17" fill="#eafff6"/><circle cx="512" cy="262" r="48" fill="#eafff6"/><path d="M494 392 C420 408 320 470 308 612 C300 722 372 800 452 770 C490 756 494 700 494 600 Z" fill="#7fe3c4"/><path d="M530 392 C604 408 704 470 716 612 C724 722 652 800 572 770 C534 756 530 700 530 600 Z" fill="#eafff6"/></svg></div><span class="badge">8</span></div><figcaption><div class="nm">Лёгкие</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure><figure class="card" data-num="9"><div class="stage"><div class="icon"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g9_ow2-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#063a52"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g9_ow2-bg)"/><path d="M474 372 Q360 312 270 352 Q330 392 350 470 Q374 566 462 624 Q500 648 482 600 Q448 512 470 432 Q478 398 474 372 Z" fill="#7fe3c4"/><path d="M550 372 Q664 312 754 352 Q694 392 674 470 Q650 566 562 624 Q524 648 542 600 Q576 512 554 432 Q546 398 550 372 Z" fill="#7fe3c4"/><path d="M512 286 Q494 360 500 446 Q500 540 512 612 Q524 540 524 446 Q530 360 512 286 Z" fill="#eafff6"/></svg></div><span class="badge">9</span></div><figcaption><div class="nm">Лёгкие · форма</div><div class="row"><button class="fav">☆ В избранное</button><button class="dl">SVG</button></div></figcaption></figure></div></main>
<script>
(function(){var favs=new Set();function upd(){var a=[...favs].sort((x,y)=>x-y);document.getElementById('favs').textContent=a.length?('Избранные: '+a.join(', ')):'Клик по иконке — в избранное, снизу номера.';}
document.querySelectorAll('.card').forEach(function(c){var n=+c.dataset.num,st=c.querySelector('.stage'),f=c.querySelector('.fav'),d=c.querySelector('.dl');function t(){if(favs.has(n)){favs.delete(n);c.classList.remove('fav');f.classList.remove('on');f.textContent='☆ В избранное';}else{favs.add(n);c.classList.add('fav');f.classList.add('on');f.textContent='★ В избранном';}upd();}st.addEventListener('click',t);f.addEventListener('click',function(e){e.stopPropagation();t();});d.addEventListener('click',function(e){e.stopPropagation();var s=new XMLSerializer().serializeToString(c.querySelector('svg'));if(s.indexOf('xmlns=')<0)s=s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');var b=new Blob([s],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='briz-s26-'+n+'.svg';document.body.appendChild(a);a.click();document.body.removeChild(a);});});
document.getElementById('size').addEventListener('input',e=>document.documentElement.style.setProperty('--icon',e.target.value+'px'));
document.getElementById('bg').addEventListener('click',function(){document.body.classList.toggle('light');this.textContent=document.body.classList.contains('light')?'🌙 Тёмный':'☀️ Светлый';});})();
</script></body></html>
