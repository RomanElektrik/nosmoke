<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оплата — Бриз</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(90% 50% at 50% 0%, rgba(29,184,90,0.22), #0A0E13 60%);
    color:#F4F6F8;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
  .card{max-width:430px}
  .badge{width:84px;height:84px;border-radius:26px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;transition:.3s}
  .badge.ok{background:linear-gradient(135deg,#1DB85A,#0A84FF)}
  .badge.wait{background:#1A222C;border:1px solid rgba(255,255,255,0.12)}
  h1{font-size:25px;font-weight:800;letter-spacing:-0.5px;margin-bottom:12px}
  p{color:#9AA6B2;font-size:16px;line-height:1.6}
  .hint{margin-top:22px;font-size:14px;color:#6B7682}
  a{color:#34D266;font-weight:600;text-decoration:none}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,0.2);border-top-color:#34D266;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="badge wait" id="badge"><div class="spin" id="spin"></div></div>
    <h1 id="title">Проверяем оплату…</h1>
    <p id="msg">Это займёт несколько секунд. Не закрывай страницу.</p>
    <p class="hint">Можно вернуться в приложение «Бриз» — Премиум включится автоматически.<br><a href="https://breezapp.ru">breezapp.ru</a></p>
  </div>
<script>
  // Честно: показываем успех только если сервер реально подтвердил подписку для
  // этого устройства. При отмене оплаты статус не станет premium — и мы не врём.
  var d = new URLSearchParams(location.search).get('d');
  var badge = document.getElementById('badge'), title = document.getElementById('title'),
      msg = document.getElementById('msg'), spin = document.getElementById('spin');
  function ok(){
    badge.className = 'badge ok';
    badge.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    title.textContent = 'Оплата прошла 🎉';
    msg.innerHTML = 'Премиум активен. <b style="color:#F4F6F8">Вернись в приложение «Бриз».</b>';
  }
  function neutral(){
    spin && spin.remove();
    badge.innerHTML = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#9AA6B2" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>';
    title.textContent = 'Окно оплаты закрыто';
    msg.innerHTML = 'Если оплата прошла — Премиум включится в приложении в течение минуты. Если передумал — ничего не списалось.';
  }
  if(!d){ neutral(); }
  else {
    var tries = 0, max = 12;
    (function poll(){
      fetch('https://breezapp.ru/api/briz/sub/' + encodeURIComponent(d))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && j.premium){ ok(); return; }
          if(++tries >= max){ neutral(); return; }
          setTimeout(poll, 2000);
        })
        .catch(function(){ if(++tries >= max){ neutral(); } else { setTimeout(poll, 2000); } });
    })();
  }
</script>
</body>
</html>
